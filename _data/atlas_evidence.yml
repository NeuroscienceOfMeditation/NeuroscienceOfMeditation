# The Living Atlas: evidence records (brain-atlas.html, brain-atlas/atlas.js).
#
# Principle: the atlas learns from research rather than piling it up. A new study can
# refine a record, add one, or challenge one, but nothing changes silently: every change
# gets a dated line in that record's history, and the weekly research watch only ever
# PROPOSES changes as a pull request for Aditi to review.
#
# Each record states what was actually studied, because a finding in ordinary breathing
# is not a finding about meditation:
#   condition: spontaneous_breathing | controlled_breathing | breath_attention |
#              meditation | sleep | mechanical_ventilation
#   timescale: state (during the practice, acute) | trait (lasting change, long-term)
#   meditation: yes | partly | no   (was meditation itself studied?)
# regions: ids from _data/brain_atlas.yml. not_on_map: reported areas the 3D map does not have.
# grade: E established · V converging · P preliminary · H hypothesis requiring testing ·
#        C contradictory or unresolved

version: "4.0"
updated: "2026-11-24"

scale:
  - { key: E, name: "Established", note: "Replicated across methods and groups; textbook physiology or anatomy." }
  - { key: V, name: "Converging", note: "Several independent studies or a meta-analysis point the same way, with known gaps." }
  - { key: P, name: "Preliminary", note: "One or a few small studies. Promising, not settled." }
  - { key: H, name: "Hypothesis requiring testing", note: "Plausible, but not yet tested directly." }
  - { key: C, name: "Contradictory or unresolved", note: "Studies disagree, or a larger study failed to confirm a smaller one." }

conditions:
  spontaneous_breathing: "Ordinary, automatic breathing"
  controlled_breathing: "Breathing paced or shaped on purpose"
  breath_attention: "Paying attention to the breath without changing it"
  meditation: "Meditation practice"
  sleep: "Sleep"
  mechanical_ventilation: "Breathing driven by a ventilator"

timescales:
  state: "During the practice (a passing state)"
  trait: "Lasting change (long-term)"

