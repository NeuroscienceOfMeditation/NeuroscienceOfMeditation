# The Meditation Brain Atlas (brain-atlas.html).
# Regions are groups of parcels from the Schaefer 2018 400-parcel, 7-network map
# on the fsaverage5 surface (MIT licence). The id must match brain-atlas/brain.bin.
# Grades: E established, S suggestive, X speculative, C contradicted.
# Only cite studies that have been checked to say what the claim says.

