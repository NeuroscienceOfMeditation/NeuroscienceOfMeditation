big_question:
  title: "Does meditation change the brain?"
  grade: C
  grade_label: "Contested"
  text: "Studies comparing long-term meditators with non-meditators find differences in several regions, with a medium effect overall. But those studies can't tell cause from effect, and the authors flag publication bias as a strong concern. The largest randomised trial so far found no structural change after an 8-week mindfulness course."
  refs: [fox2014, kral2022]

regions:
  - id: 1
    name: "Medial prefrontal cortex"
    network: "Default mode network"
    colour: "#C2611F"
    does: "Thinking about yourself and other people, and replaying the past or imagining the future. A hub of the default mode network, which is most active when the mind wanders."
    claims:
      - text: "Experienced meditators showed less activity here while meditating than people new to it, in one small study."
        grade: S
        refs: [brewer2011]

  - id: 2
    name: "Posterior cingulate and precuneus"
    network: "Default mode network"
    colour: "#D98E3A"
    does: "The other core hub of the default mode network: self-related thought, memory and mind-wandering."
    claims:
      - text: "Less active in experienced meditators during meditation, alongside the medial prefrontal cortex. Small study, cross-sectional."
        grade: S
        refs: [brewer2011]

  - id: 3
    name: "Insula"
    network: "Salience network"
    colour: "#2E7FA8"
    does: "Senses the inside of the body: heartbeat, breath, hunger, tension. Often called the seat of interoception."
    related:
      - { label: "Watch your own breath: the Swar Yoga tool", url: "/swar-yoga.html" }
      - { label: "Does slower breathing make meditation deeper?", url: "/does-slower-breathing-make-meditation-deeper.html" }
    claims:
      - text: "One of the regions recruited across several meditation styles, though results across studies converge less than often claimed."
        grade: S
        refs: [fox2016]
      - text: "Differs in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]
      - text: "Grows after an 8-week mindfulness course."
        grade: C
        refs: [kral2022]

  - id: 4
    name: "Anterior and mid cingulate cortex"
    network: "Salience network"
    colour: "#5B9BC4"
    does: "Notices conflict and errors, and helps decide where attention should go next, such as noticing the mind has wandered."
    claims:
      - text: "The dorsal anterior cingulate is recruited across several meditation styles."
        grade: S
        refs: [fox2016]
      - text: "Differs in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]

  - id: 5
    name: "Lateral and frontopolar prefrontal cortex"
    network: "Control network"
    colour: "#1B4332"
    does: "Holding a goal in mind, planning and steering attention on purpose. The frontopolar part, at the very front, is linked to meta-awareness: knowing what your mind is doing."
    claims:
      - text: "The frontopolar cortex is recruited across several meditation styles."
        grade: S
        refs: [fox2016]
      - text: "The frontopolar cortex differs in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]

  - id: 6
    name: "Orbitofrontal cortex"
    network: "Limbic and control networks"
    colour: "#8A6BB0"
    does: "Weighing what things are worth, and adjusting emotional responses as situations change."
    claims:
      - text: "Among the regions that differ in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]

  - id: 7
    name: "Somatosensory and motor cortex"
    network: "Somatomotor network"
    colour: "#3E9B5F"
    does: "Feeling touch and body position, and planning and making movements."
    claims:
      - text: "Premotor and supplementary motor areas are recruited across several meditation styles."
        grade: S
        refs: [fox2016]
      - text: "Sensory cortices differ in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]

  - id: 8
    name: "Visual cortex"
    network: "Visual network"
    colour: "#9A8F80"
    does: "Turning light from the eyes into what you see."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]


  # ---------- deep structures (Melbourne Subcortex Atlas, Tian 2020) ----------
  - id: 9
    name: "Hippocampus"
    network: "Deep structure"
    deep: true
    colour: "#B5531C"
    does: "Forming new memories, holding the context of where and when things happened, and mapping places."
    claims:
      - text: "Among the regions that differ in structure in long-term meditators, in cross-sectional studies."
        grade: S
        refs: [fox2014]
      - text: "Grows after an 8-week mindfulness course."
        grade: C
        refs: [kral2022]

  - id: 10
    name: "Amygdala"
    network: "Deep structure"
    deep: true
    colour: "#C8432B"
    does: "Detecting threat and emotional significance, and learning what to fear."
    claims:
      - text: "In one small study with no control group, people whose stress fell most after a mindfulness course showed the largest drop in amygdala grey-matter density. The group as a whole showed no change."
        grade: X
        refs: [holzel2010]
      - text: "Shrinks after an 8-week mindfulness course."
        grade: C
        refs: [kral2022]

  - id: 11
    name: "Thalamus"
    network: "Deep structure"
    deep: true
    colour: "#7D6BB0"
    does: "A relay hub: passes signals from the senses to the cortex, and helps set alertness, sleep and attention."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

  - id: 12
    name: "Caudate and putamen"
    network: "Deep structure"
    deep: true
    colour: "#4F8A8B"
    does: "Together the dorsal striatum: learning habits and skills, and selecting movements."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

  - id: 13
    name: "Nucleus accumbens"
    network: "Deep structure"
    deep: true
    colour: "#D9A520"
    does: "Reward and motivation: wanting, and learning what is worth going after."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

  - id: 14
    name: "Globus pallidus"
    network: "Deep structure"
    deep: true
    colour: "#8C8C6A"
    does: "Helps start and stop movements, as part of the basal ganglia loops."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

  - id: 15
    name: "Brainstem"
    network: "Deep structure"
    deep: true
    colour: "#A0674B"
    does: "Runs the body's automatic work: it starts every automatic breath, helps set heart rate and blood pressure, and connects the brain to the spinal cord. It is made of the midbrain, pons and medulla."
    related:
      - { label: "Watch your own breath: the Swar Yoga tool", url: "/swar-yoga.html" }
      - { label: "Measure your practice: heart-rate variability and wearables", url: "/measure-your-practice.html" }
    claims:
      - text: "Generates the automatic rhythm of breathing, from a small network in the medulla called the preBötzinger complex. Found in rats in 1991; a matching area has been identified in the human medulla."
        grade: E
        refs: [smith1991, schwarzacher2011]
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

  - id: 16
    name: "Cerebellum"
    network: "Deep structure"
    deep: true
    colour: "#B7A27C"
    does: "Coordinates and times movement and balance, and also takes part in some thinking and emotional processes."
    claims:
      - text: "No consistent meditation finding in the meta-analyses used here."
        grade: X
        refs: [fox2014, fox2016]

tours:
  - id: sitting
    button: "One sitting, four moments"
    title: "One sitting, four moments"
    intro: "In a 2012 study, 14 meditators focused on the breath inside a brain scanner and pressed a button each time they noticed their mind had wandered. Here is what the brain did around each press."
    grade: S
    refs: [hasenkamp2012]
    steps:
      - title: "1. The mind wanders"
        text: "You set out to follow the breath, and drift into a plan or a memory. Default mode network regions are most active here."
        regions: [1, 2]
        view: inside
      - title: "2. You notice"
        text: "The moment you realise you've drifted. Salience network regions, the insula and anterior cingulate, are most active."
        regions: [3, 4]
        view: right
      - title: "3. You come back"
        text: "Choosing to return to the breath. Parts of the executive (control) network take over."
        regions: [5]
        view: right
      - title: "4. You stay"
        text: "Holding attention on the breath. The executive network remains engaged, until the next drift. Noticing and returning is the practice."
        regions: [5]
        view: front

  - id: breath
    button: "How a breath is made"
    title: "How a breath is made"
    intro: "Breathing is the one automatic body rhythm you can also steer on purpose. Here is the path of a breath through the brain."
    steps:
      - title: "1. The rhythm starts deep down"
        text: "Each automatic breath is started by a small network of neurons in the medulla, the lowest part of the brainstem, called the preBötzinger complex. It keeps you breathing while you sleep."
        regions: [15]
        view: front
        glass: 0.3
        grade: E
        refs: [smith1991, schwarzacher2011]
      - title: "2. You can take over"
        text: "Unlike your heartbeat, you can slow your breath, deepen it or hold it on purpose. That voluntary control comes from the motor cortex, which can override the brainstem's rhythm for a while. Pranayama works through this route."
        regions: [7]
        view: left
      - title: "3. You feel it"
        text: "Paying attention to the sensations of breathing engages the insula, the area that maps the inside of the body. In one study, this response changed after an 8-week mindfulness course."
        regions: [3]
        view: right
        grade: S
        refs: [farb2013]
      - title: "4. It reaches emotion and memory"
        text: "In 7 people with electrodes inside the brain for epilepsy care, rhythms in the amygdala and hippocampus followed the breath when they breathed through the nose, much less through the mouth. In tests, fearful faces were recognised faster during an in-breath. A small study, so far."
        regions: [10, 9]
        view: right
        glass: 0.3
        grade: S
        refs: [zelano2016]

practices:
  intro: "Different practices, different brain patterns. The practice types come from a 2016 meta-analysis of 78 brain-imaging studies; each ball sits at the centre of a reported cluster and has the same volume. The training programmes and popular claims come from single studies that report areas rather than exact points, so the whole atlas region on that side is coloured. Every study is graded."
  sets:
    meta: "Practice types · meta-analysis"
    training: "Training programmes"
    claims: "Popular claims · small studies"
  grade: S
  refs: [fox2016]
  caveat: "Only 6 to 10 studies per practice, most of them small, so these maps may change as more research comes in. More active and less active are compared with rest or a control task, not with each other."
  list:
    - id: 1
      name: "Focused attention"
      colour: "#C2611F"
      does: "Resting attention on one object, such as the breath, and bringing it back when it wanders."
      studies: 7
      clusters:
        - { name: "Premotor cortex", hemi: L, at: [-36, 6, 56], vol: 712, up: true }
        - { name: "Dorsal anterior and mid cingulate cortex", hemi: M, at: [2, 12, 32], vol: 280, up: true }
        - { name: "Posterior cingulate cortex", hemi: M, at: [-6, -60, 18], vol: 152, up: false }
        - { name: "Inferior parietal lobule", hemi: L, at: [-48, -72, 30], vol: 144, up: false }
    - id: 2
      name: "Mantra"
      colour: "#8A6BB0"
      does: "Repeating a word, sound or phrase, silently or aloud."
      studies: 8
      clusters:
        - { name: "Premotor cortex", hemi: L, at: [-30, 4, 60], vol: 896, up: true }
        - { name: "Supplementary motor area", hemi: M, at: [0, 12, 54], vol: 584, up: true }
        - { name: "Supplementary motor area", hemi: M, at: [-4, 2, 68], vol: 112, up: true }
        - { name: "Putamen and globus pallidus", hemi: R, at: [28, -16, -6], vol: 368, up: true }
        - { name: "Fusiform gyrus", hemi: R, at: [40, -26, -30], vol: 248, up: true }
        - { name: "Cuneus", hemi: R, at: [24, -86, 26], vol: 160, up: true }
        - { name: "Precuneus", hemi: L, at: [-14, -56, 54], vol: 152, up: true }
        - { name: "Anterior insula", hemi: L, at: [-28, 25, -7], vol: 192, up: false }
    - id: 3
      name: "Open monitoring"
      colour: "#2E7FA8"
      does: "Noticing whatever arises, sounds, sensations, thoughts, without settling on any one."
      studies: 10
      clusters:
        - { name: "Supplementary motor area", hemi: M, at: [-6, 4, 60], vol: 824, up: true }
        - { name: "Dorsal anterior cingulate and pre-supplementary motor area", hemi: M, at: [-6, 18, 44], vol: 368, up: true }
        - { name: "Mid and anterior insula", hemi: L, at: [-44, 10, 4], vol: 360, up: true }
        - { name: "Inferior frontal gyrus", hemi: L, at: [-50, 16, 14], vol: 200, up: true }
        - { name: "Premotor cortex", hemi: L, at: [-44, 10, 46], vol: 104, up: true }
        - { name: "Thalamus (pulvinar)", hemi: R, at: [17, -24, 11], vol: 112, up: false }
    - id: 4
      name: "Loving-kindness and compassion"
      colour: "#3E9B5F"
      does: "Wishing yourself and others well, and feeling with their suffering."
      studies: 6
      clusters:
        - { name: "Anterior insula", hemi: R, at: [38, 22, 14], vol: 512, up: true }
        - { name: "Parieto-occipital sulcus", hemi: R, at: [24, -60, 18], vol: 344, up: true }
        - { name: "Somatosensory cortex and inferior parietal lobule", hemi: R, at: [54, -26, 30], vol: 320, up: true }

    # ---------- training programmes ----------
    - id: 5
      set: training
      name: "ReSource: Presence"
      kicker: "Training programme · 3 months"
      colour: "#1B4332"
      does: "Three months of breath meditation and body scan: training attention and awareness of the body. The first module of the 9-month ReSource Project."
      up_label: "Thicker cortex after this module"
      regions:
        - { id: 5, hemi: R, up: true, name: "Prefrontal cortex" }
        - { id: 4, hemi: R, up: true, name: "Anterior cingulate cortex" }
        - { id: 8, hemi: B, up: true, name: "Occipital cortex, extending to the lower temporal lobe" }
      finding: "People whose attention improved most during this module showed more thickening in the left middle temporal cortex."
      grade: S
      refs: [valk2017]
      caveat: "Compared with the other modules, in over 300 adults followed for 9 months. The coloured areas are this atlas's broad regions that contain the reported changes; the real changes were smaller patches. Other studies, including a large trial of an 8-week mindfulness course, found no structural change, so this is not settled."
    - id: 6
      set: training
      name: "ReSource: Affect"
      kicker: "Training programme · 3 months"
      colour: "#C2611F"
      does: "Three months of loving-kindness and compassion practice, gratitude, and learning to accept difficult feelings, including daily practice with a partner."
      up_label: "Thicker cortex after this module"
      regions:
        - { id: 3, hemi: R, up: true, name: "Insula and nearby operculum" }
        - { id: 5, hemi: R, up: true, name: "Dorsolateral prefrontal cortex" }
        - { id: 2, hemi: L, up: true, name: "Mid and posterior cingulate" }
      also: ["Right supramarginal gyrus", "Parahippocampal areas, both sides"]
      finding: "People whose compassion grew most during this module showed more thickening of the right insula."
      grade: S
      refs: [valk2017]
      caveat: "Compared with the other modules, in over 300 adults. The coloured areas are broad atlas regions containing the reported changes. Other studies of short courses found no structural change, so this is not settled."
    - id: 7
      set: training
      name: "ReSource: Perspective"
      kicker: "Training programme · 3 months"
      colour: "#5B9BC4"
      does: "Three months of observing your own thoughts and taking other people's point of view, including daily practice with a partner."
      up_label: "Thicker cortex after this module"
      regions:
        - { id: 5, hemi: L, up: true, name: "Ventrolateral prefrontal cortex" }
        - { id: 8, hemi: L, up: true, name: "Occipital cortex" }
      also: ["Right middle temporal gyrus"]
      finding: "People who got better at understanding others' thoughts showed more thickening in left parietal areas and the right temporo-parietal junction."
      grade: S
      refs: [valk2017]
      caveat: "Compared with the other modules, in over 300 adults. The coloured areas are broad atlas regions containing the reported changes. Not settled: other studies of short courses found no structural change."
    - id: 8
      set: training
      name: "Empathy training"
      kicker: "Training study"
      colour: "#8A6BB0"
      does: "Training to resonate with other people's suffering: to feel with them."
      up_label: "More active when watching others suffer, after training"
      regions:
        - { id: 3, hemi: B, up: true, name: "Anterior insula" }
        - { id: 4, hemi: B, up: true, name: "Anterior mid-cingulate cortex" }
      finding: "These are the areas linked with feeling pain yourself. Empathy training also increased negative feelings."
      grade: S
      refs: [klimecki2014]
      caveat: "One small fMRI study. The same people then did compassion training, which reversed the rise in negative feelings."
    - id: 9
      set: training
      name: "Compassion training"
      kicker: "Training study"
      colour: "#3E9B5F"
      does: "Training to meet suffering with warmth and the wish to help, rather than sharing the pain."
      up_label: "More active when watching others suffer, after training"
      regions:
        - { id: 6, hemi: B, up: true, name: "Medial orbitofrontal cortex" }
        - { id: 4, hemi: B, up: true, name: "Pregenual anterior cingulate" }
        - { id: 13, hemi: B, up: true, name: "Ventral striatum" }
      finding: "A different set of areas from empathy, linked with reward and caring. Compassion training reversed the rise in negative feelings that empathy training had caused, and increased positive feelings."
      grade: S
      refs: [klimecki2014]
      caveat: "One small fMRI study; everyone did empathy training first, so the order was not varied."

    # ---------- popular claims ----------
    - id: 10
      set: claims
      name: "Yoga Nidra"
      kicker: "Popular claim · one small study"
      colour: "#D9A520"
      does: "Guided 'yogic sleep': lying still and moving attention through the body while staying awake."
      up_label: "More dopamine released during practice"
      regions:
        - { id: 13, hemi: B, up: true, name: "Ventral striatum" }
      finding: "During Yoga Nidra, a dopamine tracer bound 7.9% less in the ventral striatum, which the authors estimated as a 65% rise in dopamine release. The '65% more dopamine' you may have read comes from that estimate."
      grade: X
      refs: [kjaer2002]
      caveat: "A PET study of a small group of experienced yoga teachers, with no separate control group, and not yet repeated. It measured dopamine, not brain activity."
    - id: 11
      set: claims
      name: "Chanting Om"
      kicker: "Popular claim · one pilot study"
      colour: "#7D6BB0"
      does: "Chanting the syllable Om aloud, with attention on the sound and its vibration."
      down_label: "Quieter during Om chanting than at rest"
      regions:
        - { id: 6, hemi: B, up: false, name: "Orbitofrontal cortex" }
        - { id: 4, hemi: B, up: false, name: "Anterior cingulate" }
        - { id: 9, hemi: B, up: false, name: "Hippocampus" }
        - { id: 11, hemi: B, up: false, name: "Thalamus" }
        - { id: 10, hemi: R, up: false, name: "Amygdala" }
      also: ["Parahippocampal gyri, both sides"]
      grade: X
      refs: [kalyani2011]
      caveat: "A pilot fMRI study of 12 volunteers, compared with rest. It has not been repeated by an independent team."
    - id: 12
      set: claims
      name: "Jhāna absorption"
      kicker: "Popular claim · single-person studies"
      colour: "#B5531C"
      does: "Deep concentration states from the Buddhist tradition, described as waves of joy and bliss that grow quieter and more still with each stage."
      up_label: "More active during jhāna than at rest"
      down_label: "Less active"
      regions:
        - { id: 13, hemi: B, up: true, name: "Nucleus accumbens (reward)" }
        - { id: 6, hemi: B, up: true, name: "Medial orbitofrontal cortex" }
        - { id: 4, hemi: B, up: true, name: "Anterior cingulate" }
        - { id: 8, hemi: B, up: false, name: "Visual cortex" }
        - { id: 7, hemi: B, up: false, name: "Somatosensory and motor cortex" }
        - { id: 16, hemi: B, up: false, name: "Cerebellum" }
      also: ["Less active: hearing cortex, language areas, and parietal areas for orienting in space"]
      finding: "One practitioner with about 6,000 hours of training appeared to switch on part of his reward system from the inside, with the senses turned down. A second, more recent case study of a different practitioner found broad network changes rather than region-by-region ones."
      grade: X
      refs: [hagerty2013, chowdhury2025]
      caveat: "Each study scanned one person, in a fixed order of stages. The reward area was located only roughly. Interesting, but it tells us what is possible for one trained person, not what jhāna does in general."
    - id: 13
      set: claims
      name: "Gamma waves in long-term practitioners"
      kicker: "Famous claim · brain waves"
      colour: "#2E7FA8"
      does: "Objectless compassion: resting in an unconditional readiness to help any living being, without a particular person in mind."
      regions: []
      finding: "Eight Buddhist practitioners with 10,000 to 50,000 hours of practice produced unusually strong, synchronised gamma brain waves (25–42 cycles a second) while meditating, far more than 10 students given a week of training. Their gamma was already higher at rest, and more hours of practice went with higher gamma. Nothing is coloured on the brain: EEG measures from the scalp, and the strongest differences were at electrodes over the front and sides of the head."
      grade: S
      refs: [lutz2004]
      caveat: "Small groups that also differed in age, culture and lifestyle, so practice may not be the cause. Gamma recorded from the scalp can be mixed with muscle signals; the authors ran checks, but treat raw gamma with care."

