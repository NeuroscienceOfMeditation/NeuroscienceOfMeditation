# Sadhu ji's guided journey through the Swar Yoga page (swar-yoga.html).
# One step = one point. "say" is what he types in his text box; "points" (optional)
# appear underneath as a short list; "action" (optional) is a "Try it now" button.
#
# action.go can be:
#   tool:observe   open the Svara tab of the breath tool
#   tool:remind    the morning reminder in the breath tool
#   tool:tattva    open the Tattva tab and start the measurement walkthrough
#   tool:practice  open the Practice tab
#   tool:ask       open the Ask the text tab
#   #some-id       scroll to that part of the page
# Content comes from the page itself and The Respiratory Codex; keep it that way.

# The guide's name, shown everywhere on the Swar Yoga page.
guide_name: Swami Neurananda

# Extra video loops for his moods. Put the mp4 in img/guide/ and its path here.
# Until a clip is set, his normal loop plays (slowed down while you settle).
guide_moods:
  meditate: /img/guide/mood-meditate.mp4   # eyes closed: during the 15-second settle and timed practice
  listen: /img/guide/mood-listen.mp4       # attentive: when he waits for your choice
  explain: /img/guide/mood-explain.mp4     # hand gesture, talking: while he speaks
  smile: /img/guide/mood-smile.mp4         # warm laugh: good moments

# "How sure is this?" — evidence shown as a chip on a lesson. Grades follow
# The Respiratory Codex: E established, S suggestive, X speculative,
# C contradicted, T tradition (stated by the text, not tested).
# Only link studies that have been checked to say what the note says.
evidence:
  nasal_cycle:
    grade: E
    note: "The nasal cycle is real and is controlled by the autonomic nervous system; the hypothalamus is thought to set its rhythm. In one study of 33 people, everyone alternated, but a switch took about 2 hours on average, from 15 minutes to over 10 hours, not one hour."
    refs:
      - { label: "Kahana-Zweig et al., PLoS ONE 2016", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5053491/" }
      - { label: "Pendolino et al., Rhinology Online 2018 (review)", url: "https://www.rhinologyonline.org/Rhinology_online_issues/manuscript_16.pdf" }
  hourly_turn:
    grade: C
    note: "Measured cycles are rarely hourly. They average about 2 hours, vary widely, and a regular clockwork pattern is seen in only about 21–39% of people."
    refs:
      - { label: "Kahana-Zweig et al., PLoS ONE 2016", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5053491/" }
      - { label: "Pendolino et al., Rhinology Online 2018 (review)", url: "https://www.rhinologyonline.org/Rhinology_online_issues/manuscript_16.pdf" }
  tradition_uses:
    grade: T
    note: "These uses come from the Shiva Svarodaya. They have not been tested. We record them as tradition, and the open record is one way to test them."
  side_lying:
    grade: E
    note: "Lying on one side tends to congest the lower nostril, so the upper one opens. Body position, not just head position, matters most."
    refs:
      - { label: "Pendolino et al., Rhinology Online 2018 (review)", url: "https://www.rhinologyonline.org/Rhinology_online_issues/manuscript_16.pdf" }
  slow_breathing:
    grade: E
    note: "Slow breathing, around six breaths a minute, is linked with higher heart-rate variability and feeling calmer. Most studies are small, so the size of the effect is still uncertain."
    refs:
      - { label: "Zaccaro et al., Frontiers in Human Neuroscience 2018 (systematic review)", url: "https://www.frontiersin.org/articles/10.3389/fnhum.2018.00353/full" }
  left_side_sleep:
    grade: E
    note: "Lying on the right side was linked with more night-time acid reflux than the left side. The study was small, ten patients with reflux disease."
    refs:
      - { label: "Khoury et al., Am J Gastroenterol 1999", url: "https://doi.org/10.1111/j.1572-0241.1999.01279.x" }
  omens:
    grade: C
    note: "There is no evidence that the breath predicts outside events. A side that stays blocked has ordinary medical causes."

chapters:
  - Welcome
  - The three channels
  - Observe your breath
  - The tattvas
  - Practice, safely
  - Your part

steps:
  # ---------- 1. Welcome ----------
  - chapter: 1
    title: Namaste
    say: "Namaste. I am Swami Neurananda. I will walk you through Swar Yoga one small step at a time. It takes about ten minutes. You can stop whenever you like, and I will remember where we were."

  - chapter: 1
    title: What svara means
    say: "Svara is the breath as it flows through the nostrils. Right now, one nostril is a little more open than the other. The Shiva Svarodaya says this side changes roughly every hour, all day long."
    evidence: hourly_turn

  - chapter: 1
    title: What science says
    say: "Today this is called the nasal cycle. It is real. The tissue inside one nostril swells while the other shrinks, controlled by the autonomic nervous system. The text described it centuries before Western medicine wrote it down in 1895."
    diagram: nasal-cycle
    evidence: nasal_cycle
    points:
      - "Measured switches take about 2 hours on average, not one, and vary a lot from person to person."
      - "The old texts also say the turning follows the lunar day. That has not held up."
      - "Few people have tracked it in daily life. That is why we ask practitioners to log theirs."

  # ---------- 2. The three channels ----------
  - chapter: 2
    title: "Ida, the left"
    say: "When the left side flows, it is Ida, the moon channel, Chandra svara. The texts call it cooling, and give it the quiet work."
    points:
      - "Study, writing, planning"
      - "Meditation and long sitting"
      - "Water, gentle food"
      - "Setting out on a journey"
    evidence: tradition_uses

  - chapter: 2
    title: "Pingala, the right"
    say: "When the right side flows, it is Pingala, the sun channel, Surya svara. The texts call it heating, and give it the work that needs force."
    points:
      - "Physical work and exercise"
      - "Digestion, the heavier meal"
      - "Tasks needing drive"
      - "Difficult conversations"
    evidence: tradition_uses

  - chapter: 2
    title: "Sushumna, both"
    say: "When both sides flow, it is Sushumna, the turning point. It is brief, often only minutes, and it marks the change from one side to the other. The texts keep it for sitting, not for worldly business."
    evidence: tradition_uses

  - chapter: 2
    title: "The honest truth"
    say: "These lists are tradition, and here we treat them as a hypothesis to test, not a rule. The Respiratory Codex finds the idea underneath sound: careful, precise work goes better when you are settled, and effortful work when you are mobilised. But which nostril is open is not what decides it."
    action: { label: "See the full lists", go: "#method" }

  # ---------- 3. Observe your breath ----------
  - chapter: 3
    title: "How to observe"
    say: "Now let us look at your own breath. Sit comfortably and breathe normally for a few breaths. Then breathe out gently onto the back of your hand, or a cool mirror, just below the nose. The larger patch of mist marks the open side."
    points:
      - "Go by what you feel, not by what you expect."
      - "The mirror is verse 153, the only instrument in the whole treatise."
    action: { label: "Try it now in the breath tool", go: "tool:observe" }

  - chapter: 3
    title: "Compare with the text"
    say: "Tell the tool which side is flowing, and roughly where you are. The Svarodaya counts the cycle from sunrise, so the tool can show you what the text expected at this hour, next to what you noticed. If they differ, that is not a mistake. It is information."
    action: { label: "Open the breath tool", go: "tool:observe" }
    diagram: sunrise-clock
    evidence: hourly_turn

  - chapter: 3
    title: "The morning check"
    say: "The one practice the text calls most important is verse 149: examine the breath every day at daybreak. One minute, before you rise, before you touch any device."
    points:
      - "Which side is flowing"
      - "The rough rate and depth of the breath"
      - "One word for your state"
      - "Thirty mornings make a baseline. Sixty reveal a pattern."
    action: { label: "Set a morning reminder", go: "tool:remind" }

  # ---------- 4. The tattvas ----------
  - chapter: 4
    title: "Reading the tattva"
    say: "The text says each breath also carries one of the five elements, the tattvas. Verses 145 to 147 describe them in eight ways. Four of these you can measure yourself, like how far the out-breath reaches on your hand. Three you can only report."
    points:
      - "Only the measured ones decide the answer here."
      - "Otherwise the guesswork borrows trust from the measurements, and tells you what you already expected."
    action: { label: "Walk me through the measurements", go: "tool:tattva" }
    diagram: tattvas

  # ---------- 5. Practice, safely ----------
  - chapter: 5
    title: "What actually works"
    say: "Here is what The Respiratory Codex finds really helps. None of it requires you to believe in nadis or tattvas."
    points:
      - "Slow breathing, about six breaths a minute, with a longer out-breath, for three to five minutes"
      - "Breathing through the nose, not the mouth"
      - "Sleeping on the left side"
      - "The one-minute morning check"
      - "A short, fixed routine before demanding tasks"
      - "Ten to fifteen minutes of attention to the breath, returning each time it wanders"
    evidence: [slow_breathing, left_side_sleep]

  - chapter: 5
    title: "Switching sides"
    say: "Want to open the other side? Lie on your side for five to ten minutes. The lower nostril tends to close and the upper one opens, so lie on the side opposite the nostril you want to open. The text also gives pressing a fist under the armpit; that one has been studied less."
    action: { label: "Open the practices", go: "tool:practice" }
    evidence: side_lying

  - chapter: 5
    title: "Before you practise"
    say: "Please listen carefully to this one. The breath is a friend, never a battle."
    points:
      - "No breath-holding with high blood pressure, a heart rhythm problem, glaucoma or retinal disease, or in pregnancy."
      - "When covering the eyes, touch lightly. Never press on the eyeballs."
      - "Never gaze at the sun, even briefly."
      - "Don't tape your mouth for sleep. It can be dangerous with sleep apnoea or a blocked nose."
      - "Stop if you feel dizzy or breathless, or get chest discomfort, a headache or changes in vision."

  - chapter: 5
    title: "What does not hold up"
    say: "And I must be honest about what the old text gets wrong."
    points:
      - "The moon's phase and the day of the week do not change which side flows."
      - "The breath does not predict journeys, lost objects, contests or the sex of a child."
      - "A side that stays blocked has ordinary causes, such as a deviated septum or sinusitis. See an ENT doctor."
      - "The death timetables are not just wrong but harmful. If omens leave you checking your body again and again, that worry is the thing to get help with."
    evidence: omens

  # ---------- 6. Your part ----------
  - chapter: 6
    title: "The open record"
    say: "Now, your part. If you wish, you can add your morning observations to the open record. It is off by default, and you can ask for your data to be deleted at any time. When there is enough, we will publish what it shows, even where it disagrees with the texts."
    points:
      - "Does the turn really take about an hour?"
      - "Does the lunar day predict the sunrise side?"
      - "Does the active side track energy and mood?"
      - "Do the text's practices actually switch the side?"
    action: { label: "See the record", go: "#open-record" }

  - chapter: 6
    title: "Go well"
    say: "That is the whole path. Observe each morning, practise gently, and keep what you notice honestly. Whenever you have a question, ask the text and I will answer only from the verses. Come back tomorrow at daybreak."
    action: { label: "Ask the text a question", go: "tool:ask" }
