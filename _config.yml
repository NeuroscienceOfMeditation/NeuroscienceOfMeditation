# Site settings for Jekyll (GitHub Pages builds this automatically)
title: Neuroscience of Meditation
tagline: Science, practice & consciousness
description: >-
  Evidence-checked yoga, breathwork and meditation. What traditional practices
  claim, what research can measure, and what the studies actually show.
url: "https://neuroscienceofmeditation.in"
baseurl: ""
lang: en_IN
author: Aditi
logo: /img/icon-512.png
social:
  name: Neuroscience of Meditation
  links:
    - https://www.instagram.com/neuroscienceofmeditation/
timezone: Asia/Kolkata

# Contact form delivery. Paste your free Web3Forms access key between the
# quotes (get one at web3forms.com with adiyogistudios@gmail.com) and the
# contact form sends messages straight to that inbox. Left empty, the form
# opens the visitor's email app instead, as before. The key is safe to
# publish: it can only send mail to your own address.
contact_form_key: ""

markdown: kramdown
kramdown:
  auto_ids: true

# Keep URLs flat like the rest of the site, e.g. /nadi-shodhana-without-mythology.html
# (:output_ext keeps ".html" on pages too, so canonical links match the links on the site)
permalink: /:title:output_ext

# Aṇūṭṭara magazine: each issue is a folder in _anuttara/ (issue-01, issue-02 …)
# holding an index.md (the contents page) and one .md file per piece.
# A piece stays off the site while its front matter says published: false.
collections:
  anuttara:
    output: true
    permalink: /anuttara/:path:output_ext

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      image: /img/og-default.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: anuttara
    values:
      layout: anuttara-piece
      author: Aditi

# Files that should never be published
exclude:
  - SVARA-BUILD-NOTES.md
  - README.md
  - _drafts/README.md
  # Scripts that build things for other platforms; not part of the website
  - tools
  # UGC NET dashboard: only index.html, assets/, data/ and js/ are published
  - ugc-net-pyq/README.md
  - ugc-net-pyq/package.json
  - ugc-net-pyq/package-lock.json
  - ugc-net-pyq/tailwind.config.js
  - ugc-net-pyq/src
  - ugc-net-pyq/tests
  - ugc-net-pyq/node_modules
