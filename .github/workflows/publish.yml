## The Publish button.
##
## Repo -> Actions -> "Publish everywhere" -> Run workflow.
## Works from a phone. Leave both boxes alone to push out the newest article.
##
## What it does, and what it deliberately does not:
##   Website     publishes a draft if you name one, otherwise uses the newest post
##   Substack    writes a paste-ready file (Substack has no API for posting)
##   Newsletter  creates a Kit broadcast, as a DRAFT unless you tick the box
##   Instagram   writes the caption (API posting needs Meta App Review)

name: Publish everywhere

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft to publish (filename in _drafts/, blank = use newest post)"
        required: false
        default: ""
      send_newsletter:
        description: "Actually send the newsletter? Leave unticked to create a draft in Kit you can read first."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet markdown playwright
          python -m playwright install --with-deps chromium

      - name: Publish
        env:
          # Add this under Settings -> Secrets and variables -> Actions.
          # Without it the newsletter step is skipped and nothing else breaks.
          KIT_API_SECRET: ${{ secrets.KIT_API_SECRET }}
        run: |
          python3 tools/publish.py \
            ${{ inputs.draft != '' && format('--draft "{0}"', inputs.draft) || '' }} \
            ${{ inputs.send_newsletter && '--send-newsletter' || '' }}

      - name: Commit what changed
        run: |
          git config user.name  "Publish button"
          git config user.email "adiyogistudios@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, so nothing to commit."
          else
            git commit -m "Publish: push article out to every destination

          Ran from the Publish button. See the run summary for what still
          needs doing by hand."
            git push
          fi
