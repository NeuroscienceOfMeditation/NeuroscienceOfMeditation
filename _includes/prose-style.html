{% comment %} Reading styles shared by articles (_layouts/post.html) and Aṇūṭṭara pieces. {% endcomment %}
  <style>
    .prose{max-width:720px;margin:0 auto}
    /* Body text is near-black on cream (about 11:1) for comfortable long reading. */
    .prose p,.prose li{font-size:18px;line-height:1.85;color:#33382C}
    .prose p{margin:0 0 22px}
    .prose h2{font-size:clamp(26px,3.2vw,34px);line-height:1.12;margin:52px 0 16px;color:var(--ink)}
    .prose h3{font-size:22px;margin:36px 0 12px}
    .prose a{color:var(--forest-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
    .prose a:hover{text-decoration-thickness:2px}
    .prose strong{color:var(--ink)}
    .prose ul,.prose ol{padding-left:22px;margin:0 0 22px}
    .prose blockquote{margin:36px 0;padding:6px 0 6px 24px;border-left:3px solid var(--gold)}
    .prose blockquote p:last-child{margin-bottom:0}
    .prose blockquote p{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.55;color:var(--forest-ink)}
    .takeaway{max-width:720px;margin:0 auto 40px;padding:22px 26px;border-radius:16px;background:var(--cream-2);border-left:4px solid var(--forest)}
    .takeaway .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:700;margin-bottom:8px}
    .takeaway p{margin:0;font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink)}
    .prose #sources + ul li,.prose #sources + ol li,.prose #references + ul li{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
    /* Tables: scroll sideways on phones instead of squeezing the page. */
    .prose table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-collapse:collapse;margin:8px 0 30px;font-size:15px;line-height:1.55}
    .prose th,.prose td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:150px}
    .prose th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:700;border-bottom:2px solid var(--forest)}
    .prose td{color:#33382C}
    .prose td:first-child{font-weight:600;color:var(--ink)}
    .prose tbody tr:nth-child(even){background:var(--cream-2)}
    .post-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:13px;color:var(--ink-60)}
    .post-note{max-width:720px;margin:56px auto 0}
    .post-head{max-width:720px;margin:0 auto}
    .back{display:inline-block;margin-bottom:24px;color:var(--forest-ink);text-decoration:none;font-size:13px;font-weight:600}
    @media (prefers-color-scheme:dark){.prose p,.prose li,.prose td{color:#DAD5C4}}
    @media (max-width:640px){.prose p,.prose li{font-size:17px;line-height:1.8}.prose blockquote p{font-size:19px}.takeaway p{font-size:18px}}
    /* Phones: the row label stays in view while the rest of the table scrolls. */
    @media (max-width:640px){
      .prose table{font-size:14px}
      .prose th,.prose td{min-width:132px;padding:10px 12px}
      .prose th:first-child,.prose td:first-child{position:sticky;left:0;min-width:112px;background:var(--cream);box-shadow:6px 0 8px -6px rgba(0,0,0,.25)}
      .prose tbody tr:nth-child(even) td:first-child{background:var(--cream-2)}
    }
  </style>
